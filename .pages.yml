# .pages.yml
media:
  input: /image
  output: https://raw.flygeon.eu.org/Flygeon/Astro/refs/heads/main/image/
  rename: safe
  extensions: [png, jpg, jpeg, webp, gif, svg]

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    subfolders: true

    fields:
      # ---------- 新增 id 字段（用于生成文件名）----------
      - name: create
        label: 文章序号
        type: string
        required: true
        hint: "请输入数字序号，如 001、002（需手动维护连续）"
        # 建议在后台排列时将该字段放在最前面，便于填写

      - name: title
        label: 标题
        type: string
        required: true

      - name: published
        label: 发布日期
        type: date
        required: true

      - name: body
        label: 正文
        type: rich-text
        required: true

      - name: description
        label: 摘要
        type: text
        required: false

      - name: image
        label: 封面图片 URL
        type: string
        required: false
        hint: 输入完整图片链接

      - name: tags
        label: 标签
        type: string
        list: true
        required: false

      - name: category
        label: 分类
        type: string
        required: false

      - name: draft
        label: 草稿
        type: boolean
        default: false

      # Fuwari 扩展字段（可选）
      - name: updated
        label: 更新日期
        type: date
        required: false

      - name: pinned
        label: 置顶
        type: boolean
        default: false


    view:
      primary: title
      sort: published
      order: desc
      fields: [create, title, published, draft, tags]   # 列表显示 id 方便查看

    # ---------- 文件名模板：使用 id 字段的值 ----------
    filename:
      template: "{primary}.md"
      field: title       # 从 frontmatter 的 create 字段取值，注意必须存在且非空