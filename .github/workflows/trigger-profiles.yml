name: Trigger Profiles Deployment
on:
  workflow_dispatch:  # 只监听手动触发

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profiles repository deployment
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PROFILES_REPO_PAT }}" \
            https://api.github.com/repos/Flygeon/profiles/dispatches \
            -d '{"event_type":"deploy-profiles"}'
