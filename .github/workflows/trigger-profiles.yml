name: Trigger Profiles Deployment
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 发送触发信号到 profiles 仓库
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PROFILES_REPO_PAT }}" \
            https://api.github.com/repos/您的用户名/profiles/dispatches \
            -d '{"event_type":"deploy-profiles"}'
