# Astro 仓库的 .github/workflows/trigger-profiles.yml
name: Trigger Profiles Deployment
on:
  workflow_dispatch: # 允许手动触发，方便测试
  # 注意：这里不能直接由 Pages CMS 的 action 触发，而是作为桥梁

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 发送触发信号到 profiles 仓库
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PROFILES_REPO_PAT }}" \ # 需要配置 Personal Access Token
            https://api.github.com/repos/Flygeon/profiles/dispatches \
            -d '{"event_type":"deploy-profiles"}'
