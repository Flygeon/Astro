name: Trigger Profiles on Push
on:
  push:
    branches:
      - main  # 当 main 分支有 push 时触发
    paths:
      - 'src/content/posts/**'  # 仅当文章内容变化时触发，可根据需要调整

jobs:
  trigger-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Send trigger to profiles repository
        run: |
          echo "🚀 开始触发 profiles 仓库部署..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PROFILES_REPO_PAT }}" \
            https://api.github.com/repos/Flygeon/profiles/dispatches \
            -d '{"event_type":"astro-updated"}'
          echo "✅ 触发信号已发送"
